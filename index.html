<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Public Camera Feed</title>

    <!-- ✅ Correct Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p+nA+e4FwU5Mzdg3NofM8JrIoVNewc19hXtF6G+zV6M=" crossorigin="anonymous" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .location-toggle-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <button id="locationToggle" class="btn btn-primary location-toggle-btn">Enable Location</button>
    <div id="map"></div>

    <!-- ✅ Leaflet JS (before custom script) -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j/W1Zo5RJ1gJ6rtiuZry8hDQh1L+UzbB/6qa5uM=" crossorigin="anonymous"></script>

    <!-- jQuery and Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- ✅ Custom Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ✅ Initialize map after DOM is ready
            const map = L.map('map').setView([39.3, -77.4], 10);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // ✅ Fetch camera data from data.xml
            fetch('data.xml')
                .then(response => response.text())
                .then(xmlString => {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, 'application/xml');
                    const videos = xmlDoc.getElementsByTagName('Video');

                    for (let i = 0; i < videos.length; i++) {
                        const lat = parseFloat(videos[i].getElementsByTagName('lat')[0].textContent);
                        const lon = parseFloat(videos[i].getElementsByTagName('lon')[0].textContent);
                        const videoURL = videos[i].getElementsByTagName('publicVideoURL')[0].textContent;
                        const description = videos[i].getElementsByTagName('description')[0].textContent;

                        const marker = L.marker([lat, lon]).addTo(map);
                        marker.bindPopup(`<b>${description}</b><br><a href="${videoURL}" target="_blank">View Live Feed</a>`);
                    }
                })
                .catch(err => {
                    console.error('Failed to load data.xml:', err);
                });
        });
    </script>
</body>

</html>
