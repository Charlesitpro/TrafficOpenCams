<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Cameras Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    iframe {
      width: 320px;
      height: 240px;
      border: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- JavaScript to initialize the map and load camera data -->
  <script>
    // Initialize the map at a default location
    const map = L.map('map').setView([39.2773, -77.3236], 10);

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load camera data from data.json
    fetch('data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to load camera data");
        }
        return response.json();
      })
      .then(cameraData => {
        cameraData.data.forEach(camera => {
          if (camera.lat && camera.lon) {
            const marker = L.marker([camera.lat, camera.lon]).addTo(map);
            marker.bindPopup(`
              <strong>${camera.name}</strong><br>
              <iframe src="${camera.publicVideoURL}" allowfullscreen></iframe>
            `);
          }
        });
      })
      .catch(error => {
        console.error("Error loading camera data:", error);
      });
  </script>
</body>
</html>
